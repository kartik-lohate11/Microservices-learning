spring.application.name=order
server.port=8082

management.endpoints.web.exposure.include=*
eureka.client.service-url.defaultZone=http://localhost:8091/eureka

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Output Binding
spring.cloud.stream.bindings.sendCommunication-out-0.destination=sent-communication

spring.cloud.function.definition=updateOrder
spring.cloud.stream.bindings.updateOrder-in-0.destination=communication-send
spring.cloud.stream.bindings.updateOrder-in-0.group=${spring.application.name}


# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10s