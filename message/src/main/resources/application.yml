spring:
  application:
    name: message
  cloud:
    function:
      definition: send|sms
    stream:
      bindings:
        sendsms-in-0:
          destination: send-communication
          group: ${spring.application.name}
        sendsms-out-0:
          destination: communication-send

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s

server:
  port: 9091


