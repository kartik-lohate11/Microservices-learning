version: "3.9"

services:
  order-service:
    container_name: order
    image: kartik/order:v1
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8091/eureka
    depends_on:
      - eureka-server
    networks:
      - kartik-services-network

  audit-service:
    container_name: audit
    image: kartik/audit:v1
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8091/eureka
    depends_on:
      - eureka-server
    networks:
      - kartik-services-network

  payment-service:
    container_name: payment
    image: kartik/payment:v1
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8091/eureka
    depends_on:
      - eureka-server
    networks:
      - kartik-services-network

  eureka-server:
    container_name: eureka
    image: kartik/eureka:v1
    ports:
      - "8091:8091"
    networks:
      - kartik-services-network

  gateway-server:
    container_name: gateway
    image: kartik/gateway:v1
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8091/eureka
    ports:
      - "8011:8011"
    networks:
      - kartik-services-network
    depends_on:
      - eureka-server

networks:
  kartik-services-network:
    driver: bridge